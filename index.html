    <style>

        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        

        :root {

            --hacker-green: #0f0;

            --terminal-bg: rgba(0, 0, 0, 0.9);

            --glow-color: rgba(0, 255, 0, 0.3);

        }



        body {

            background-color: #000;

            color: var(--hacker-green);

            font-family: 'Share Tech Mono', monospace;

            margin: 0;

            padding: 20px;

            line-height: 1.4;

            overflow-x: hidden;

            position: relative;

            background-image: 

                radial-gradient(circle at 50% 50%, rgba(0, 255, 0, 0.1) 1px, transparent 1px),

                radial-gradient(circle at 50% 50%, rgba(0, 255, 0, 0.1) 1px, transparent 1px);

            background-size: 50px 50px;

            background-position: 0 0, 25px 25px;

        }



        .terminal {

            background-color: var(--terminal-bg);

            border: 2px solid var(--hacker-green);

            padding: 20px;

            margin: 20px auto;

            max-width: 1200px;

            box-shadow: 0 0 30px var(--glow-color), 0 0 60px rgba(255, 0, 0, 0.2);

            position: relative;

            z-index: 2;

            backdrop-filter: blur(5px);

            border-radius: 5px;

            animation: terminalGlitch 5s infinite, terminalPulse 2s infinite;

        }



        @keyframes terminalPulse {

            0% { box-shadow: 0 0 30px var(--glow-color), 0 0 60px rgba(255, 0, 0, 0.2); }

            50% { box-shadow: 0 0 50px var(--glow-color), 0 0 100px rgba(255, 0, 0, 0.3); }

            100% { box-shadow: 0 0 30px var(--glow-color), 0 0 60px rgba(255, 0, 0, 0.2); }

        }



        .terminal::before {

            content: '';

            position: absolute;

            top: 0;

            left: 0;

            right: 0;

            bottom: 0;

            background: linear-gradient(

                45deg,

                transparent 45%,

                var(--glow-color) 50%,

                transparent 55%

            );

            background-size: 200% 200%;

            animation: matrix 10s linear infinite;

            pointer-events: none;

            opacity: 0.1;

        }



        @keyframes matrix {

            0% { background-position: 0% 0%; }

            100% { background-position: 200% 200%; }

        }



        .ascii-art {

            white-space: pre;

            font-size: 12px;

            line-height: 1;

            margin: 20px 0;

            text-align: center;

            text-shadow: 0 0 5px var(--glow-color);

            filter: drop-shadow(0 0 5px var(--glow-color));

            animation: asciiGlow 2s infinite alternate;

        }



        @keyframes asciiGlow {

            0% { filter: drop-shadow(0 0 5px var(--glow-color)); }

            100% { filter: drop-shadow(0 0 15px var(--glow-color)); }

        }



        .data-table {

            width: 100%;

            border-collapse: collapse;

            margin: 20px 0;

            font-size: 14px;

            border: 1px solid var(--hacker-green);

            animation: tableGlow 2s infinite alternate;

        }



        @keyframes tableGlow {

            0% { border-color: var(--hacker-green); }

            100% { border-color: #0f0; box-shadow: 0 0 20px var(--glow-color); }

        }

            border: 1px solid var(--hacker-green);

            padding: 8px;

            text-align: left;

            transition: all 0.3s ease;

            cursor: pointer;

            color: var(--hacker-green);

        }

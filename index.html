<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACCESS GRANTED</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        :root {
            --hacker-green: #0f0;
            --terminal-bg: rgba(0, 0, 0, 0.9);
            --glow-color: rgba(0, 255, 0, 0.3);
        }

        body {
            background-color: #000;
            color: var(--hacker-green);
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 20px;
            line-height: 1.4;
            overflow-x: hidden;
            position: relative;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 255, 0, 0.1) 1px, transparent 1px),
                radial-gradient(circle at 50% 50%, rgba(0, 255, 0, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
        }

        .terminal {
            background-color: var(--terminal-bg);
            border: 2px solid var(--hacker-green);
            padding: 20px;
            margin: 20px auto;
            max-width: 1200px;
            box-shadow: 0 0 30px var(--glow-color), 0 0 60px rgba(255, 0, 0, 0.2);
            position: relative;
            z-index: 2;
            backdrop-filter: blur(5px);
            border-radius: 5px;
            animation: terminalGlitch 5s infinite, terminalPulse 2s infinite;
        }

        @keyframes terminalPulse {
            0% { box-shadow: 0 0 30px var(--glow-color), 0 0 60px rgba(255, 0, 0, 0.2); }
            50% { box-shadow: 0 0 50px var(--glow-color), 0 0 100px rgba(255, 0, 0, 0.3); }
            100% { box-shadow: 0 0 30px var(--glow-color), 0 0 60px rgba(255, 0, 0, 0.2); }
        }

        .terminal::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                45deg,
                transparent 45%,
                var(--glow-color) 50%,
                transparent 55%
            );
            background-size: 200% 200%;
            animation: matrix 10s linear infinite;
            pointer-events: none;
            opacity: 0.1;
        }

        @keyframes matrix {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 200%; }
        }

        .ascii-art {
            white-space: pre;
            font-size: 12px;
            line-height: 1;
            margin: 20px 0;
            text-align: center;
            text-shadow: 0 0 5px var(--glow-color);
            filter: drop-shadow(0 0 5px var(--glow-color));
            animation: asciiGlow 2s infinite alternate;
        }

        @keyframes asciiGlow {
            0% { filter: drop-shadow(0 0 5px var(--glow-color)); }
            100% { filter: drop-shadow(0 0 15px var(--glow-color)); }
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 14px;
            border: 1px solid var(--hacker-green);
            animation: tableGlow 2s infinite alternate;
        }

        @keyframes tableGlow {
            0% { border-color: var(--hacker-green); }
            100% { border-color: #0f0; box-shadow: 0 0 20px var(--glow-color); }
        }

        .data-table th, .data-table td {
            border: 1px solid var(--hacker-green);
            padding: 8px;
            text-align: left;
            transition: all 0.3s ease;
            cursor: pointer;
            color: var(--hacker-green);
        }

        .data-table th {
            background-color: rgba(0, 255, 0, 0.1);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px var(--glow-color), 0 0 10px rgba(255, 0, 0, 0.2);
        }

        .data-table tr:hover {
            background-color: rgba(0, 255, 0, 0.05);
            transform: scale(1.01);
            box-shadow: 0 0 15px var(--glow-color), 0 0 30px rgba(255, 0, 0, 0.2);
        }

        .data-table td:hover {
            background-color: rgba(0, 255, 0, 0.1);
            transform: scale(1.02);
            box-shadow: 0 0 20px var(--glow-color), 0 0 40px rgba(255, 0, 0, 0.3);
        }

        .message {
            margin: 20px 0;
            text-shadow: 0 0 5px var(--glow-color);
            position: relative;
            padding-left: 20px;
            animation: messageGlow 2s infinite alternate;
        }

        @keyframes messageGlow {
            0% { text-shadow: 0 0 5px var(--glow-color); }
            100% { text-shadow: 0 0 15px var(--glow-color); }
        }

        .message::before {
            content: '>';
            position: absolute;
            left: 0;
            color: var(--hacker-green);
            opacity: 0.8;
        }

        .user-info {
            margin: 20px 0;
            text-shadow: 0 0 5px var(--glow-color);
            position: relative;
            padding-left: 20px;
            animation: infoGlow 2s infinite alternate;
        }

        @keyframes infoGlow {
            0% { text-shadow: 0 0 5px var(--glow-color); }
            100% { text-shadow: 0 0 15px var(--glow-color); }
        }

        .user-info::before {
            content: '>';
            position: absolute;
            left: 0;
            color: var(--hacker-green);
            opacity: 0.8;
        }

        .data-container {
            margin: 20px 0;
            border: 1px solid var(--hacker-green);
            box-shadow: 0 0 10px var(--glow-color);
            animation: containerGlow 2s infinite alternate;
        }

        @keyframes containerGlow {
            0% { box-shadow: 0 0 10px var(--glow-color); }
            100% { box-shadow: 0 0 20px var(--glow-color); }
        }

        .terminal-header {
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--glow-color);
            position: relative;
            animation: headerGlow 2s infinite alternate;
        }

        @keyframes headerGlow {
            0% { text-shadow: 0 0 10px var(--glow-color); }
            100% { text-shadow: 0 0 20px var(--glow-color); }
        }

        .terminal-header h1 {
            margin: 0;
            font-size: 28px;
            color: var(--hacker-green);
            position: relative;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--glow-color), 0 0 20px rgba(255, 0, 0, 0.3);
            animation: headerGlitch 2s infinite;
        }

        @keyframes headerGlitch {
            0% {
                text-shadow: 0 0 10px var(--glow-color), 0 0 20px rgba(255, 0, 0, 0.3);
                transform: translate(0);
            }
            20% {
                text-shadow: 0 0 20px var(--glow-color), 0 0 40px rgba(255, 0, 0, 0.4);
                transform: translate(-3px, 3px);
            }
            40% {
                text-shadow: 0 0 10px var(--glow-color), 0 0 20px rgba(255, 0, 0, 0.3);
                transform: translate(3px, -3px);
            }
            60% {
                text-shadow: 0 0 20px var(--glow-color), 0 0 40px rgba(255, 0, 0, 0.4);
                transform: translate(-3px, -3px);
            }
            80% {
                text-shadow: 0 0 10px var(--glow-color), 0 0 20px rgba(255, 0, 0, 0.3);
                transform: translate(3px, 3px);
            }
            100% {
                text-shadow: 0 0 10px var(--glow-color), 0 0 20px rgba(255, 0, 0, 0.3);
                transform: translate(0);
            }
        }

        .matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.4;
            mix-blend-mode: screen;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.1) 0%,
                rgba(0, 0, 0, 0.2) 50%,
                rgba(0, 0, 0, 0.1) 100%
            );
        }

        .matrix-rain div {
            font-family: 'Share Tech Mono', monospace;
            writing-mode: vertical-rl;
            text-orientation: upright;
            white-space: nowrap;
            overflow: hidden;
            text-shadow: 0 0 5px var(--glow-color), 0 0 10px rgba(255, 0, 0, 0.2);
        }

        @keyframes fall {
            0% {
                transform: translateY(-100%);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        .glitch {
            position: relative;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--terminal-bg);
        }

        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 var(--hacker-green);
            animation: glitch-1 2s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -2px;
            text-shadow: 2px 0 var(--hacker-green);
            animation: glitch-2 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-1 {
            0% { clip-path: inset(20% 0 0 0); }
            100% { clip-path: inset(0 0 20% 0); }
        }

        @keyframes glitch-2 {
            0% { clip-path: inset(0 0 20% 0); }
            100% { clip-path: inset(20% 0 0 0); }
        }

        .password, .email {
            color: var(--hacker-green);
            text-shadow: 0 0 5px var(--glow-color);
            animation: cellGlow 2s infinite alternate;
        }

        @keyframes cellGlow {
            0% { text-shadow: 0 0 5px var(--glow-color); }
            100% { text-shadow: 0 0 15px var(--glow-color); }
        }

        .link a {
            color: var(--hacker-green);
            text-shadow: 0 0 5px var(--glow-color);
            text-decoration: none;
            transition: all 0.3s ease;
            animation: linkGlow 2s infinite alternate;
        }

        @keyframes linkGlow {
            0% { text-shadow: 0 0 5px var(--glow-color); }
            100% { text-shadow: 0 0 15px var(--glow-color); }
        }

        .link a:hover {
            text-shadow: 0 0 20px var(--glow-color);
            transform: scale(1.02);
        }

        @keyframes glitch {
            0% {
                transform: translate(0);
                opacity: 0.3;
                filter: brightness(1) contrast(1);
            }
            20% {
                transform: translate(-3px, 3px);
                opacity: 0.4;
                filter: brightness(1.3) contrast(1.3);
            }
            40% {
                transform: translate(-3px, -3px);
                opacity: 0.3;
                filter: brightness(0.7) contrast(1.3);
            }
            60% {
                transform: translate(3px, 3px);
                opacity: 0.4;
                filter: brightness(1.3) contrast(0.7);
            }
            80% {
                transform: translate(3px, -3px);
                opacity: 0.3;
                filter: brightness(0.7) contrast(0.7);
            }
            100% {
                transform: translate(0);
                opacity: 0.3;
                filter: brightness(1) contrast(1);
            }
        }

        @keyframes distort {
            0% {
                transform: scale(1);
                opacity: 0.2;
            }
            50% {
                transform: scale(1.03);
                opacity: 0.3;
            }
            100% {
                transform: scale(1);
                opacity: 0.2;
            }
        }

        .glitch-overlay {
            background: linear-gradient(
                45deg,
                transparent 45%,
                var(--glow-color) 50%,
                transparent 55%
            );
            background-size: 200% 200%;
            animation: glitch 0.3s infinite;
            mix-blend-mode: screen;
        }

        .screen-distortion {
            background: radial-gradient(
                circle at center,
                transparent 0%,
                rgba(255, 0, 0, 0.2) 50%,
                rgba(0, 255, 0, 0.2) 100%
            );
            animation: distort 2s infinite;
            mix-blend-mode: screen;
        }

        @keyframes terminalGlitch {
            0% {
                transform: translate(0);
                filter: brightness(1);
            }
            20% {
                transform: translate(-2px, 2px);
                filter: brightness(1.2);
            }
            40% {
                transform: translate(-2px, -2px);
                filter: brightness(0.8);
            }
            60% {
                transform: translate(2px, 2px);
                filter: brightness(1.2);
            }
            80% {
                transform: translate(2px, -2px);
                filter: brightness(0.8);
            }
            100% {
                transform: translate(0);
                filter: brightness(1);
            }
        }

        .play-button {
            background: transparent;
            border: 2px solid var(--hacker-green);
            color: var(--hacker-green);
            padding: 8px 16px;
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px var(--glow-color);
            box-shadow: 0 0 10px var(--glow-color);
        }

        .play-button:hover {
            background: rgba(0, 255, 0, 0.1);
            box-shadow: 0 0 20px var(--glow-color), 0 0 40px rgba(255, 0, 0, 0.2);
            transform: scale(1.05);
        }

        .boot-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--hacker-green);
            font-family: 'Share Tech Mono', monospace;
            text-align: center;
            cursor: pointer;
        }

        .boot-text {
            font-size: 18px;
            line-height: 1.5;
            text-shadow: 0 0 10px var(--glow-color);
            margin-bottom: 20px;
            animation: textGlow 2s infinite alternate;
        }

        @keyframes textGlow {
            0% { text-shadow: 0 0 10px var(--glow-color); }
            100% { text-shadow: 0 0 20px var(--glow-color), 0 0 40px rgba(255, 0, 0, 0.3); }
        }

        .click-prompt {
            font-size: 14px;
            opacity: 0.7;
            animation: fadeInOut 2s infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="boot-overlay" id="bootOverlay">
        <div class="boot-text" id="bootText"></div>
        <div class="click-prompt" id="clickPrompt" style="display: none;">[ CLICK ANYWHERE TO CONTINUE ]</div>
    </div>
    <div class="matrix-rain"></div>
    <div class="terminal">
        <div class="terminal-header">
            <h1 class="glitch" data-text="SYSTEM BREACH DETECTED">SYSTEM BREACH DETECTED</h1>
        </div>
        <div id="ascii-art-1" class="ascii-art"></div>
        <div id="ascii-art-2" class="ascii-art"></div>
        <div id="messages" class="message"></div>
        <div id="user-info" class="user-info"></div>
        <div class="data-container">
            <table id="data-table" class="data-table">
                <thead>
                    <tr>
                        <th>Email/Nick</th>
                        <th>Password</th>
                        <th>Link</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
        </div>
        <div id="final-messages" class="message"></div>
    </div>
    <audio id="bgMusic" loop>
        <source src="klein.mp3" type="audio/mpeg">
    </audio>
    <script src="script.js"></script>
</body>
</html>
